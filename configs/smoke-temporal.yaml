# 路径为示例，部署前请修改（docs/DEPLOY.md）
task_id: smoke-temporal
source:
  type: video
  uri: ./output/test-clip.mp4
mode: temporal
frame_stride: 1
temporal:
  window_seconds: 2
  frames_count: 6
vlm:
  base_url: http://127.0.0.1:8001/v1
  model: Qwen2.5-VL-7B-Instruct-AWQ
  max_tokens: 512
target_actions: ["人员摔倒"]
alarm:
  cooldown_seconds: 0
  output_dir: ./output
consumer_threads: 1
